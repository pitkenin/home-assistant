- id: '1786401410106'
  alias: Jungle Egg Auto Finish
  description: Detects and tells the Audio Controller that an easter egg has finished
    playing and the ambient volume can be restored to its original value.
  triggers:
  - trigger: state
    entity_id:
    - media_player.janitor_primary
    - media_player.janitor_secondary
    to: idle
  conditions:
  - condition: template
    value_template: '{{ trigger.entity_id == states(''input_text.jungle_egg_player'')
      }}'
  actions:
  - action: script.jungle_audio_controller
    data:
      action: stop
      category: easter_egg
  mode: single
- id: '1786444348361'
  alias: Jungle Easter Egg Handler
  description: Listens for triggers in the Jungle and queues up easter egg sounds
    using a helper script
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.jungle_presence
    to: 'on'
    id: room_detected
  - trigger: state
    entity_id:
    - binary_sensor.jungle_toilet_presence
    to: 'on'
    id: toilet_detected
  - trigger: state
    entity_id:
    - binary_sensor.jungle_toilet_presence
    to: 'off'
    id: toilet_clear
  - trigger: state
    entity_id:
    - binary_sensor.jungle_shower_presence
    to:
    - 'on'
    for:
      hours: 0
      minutes: 0
      seconds: 0
    id: shower_detected
  - trigger: state
    entity_id:
    - binary_sensor.jungle_shower_presence
    to:
    - 'off'
    for:
      hours: 0
      minutes: 0
      seconds: 0
    id: shower_clear
  - trigger: state
    entity_id:
    - binary_sensor.jungle_door_area_presence
    to:
    - 'on'
    for:
      hours: 0
      minutes: 0
      seconds: 0
    id: door_detected
  - trigger: state
    entity_id:
    - binary_sensor.jungle_door_area_presence
    to:
    - 'on'
    for:
      hours: 0
      minutes: 0
      seconds: 0
    id: door_detected
  - trigger: state
    entity_id:
    - binary_sensor.jungle_sink_presence
    to:
    - 'on'
    for:
      hours: 0
      minutes: 0
      seconds: 0
    id: sink_detected
  - trigger: state
    entity_id:
    - binary_sensor.jungle_sink_presence
    to:
    - 'off'
    for:
      hours: 0
      minutes: 0
      seconds: 0
    id: sink_clear
  conditions:
  - condition: occupancy.is_detected
    target:
      entity_id: binary_sensor.jungle_presence
    options:
      behavior: any
      for: 00:00:00
  - condition: state
    entity_id: input_boolean.thunderstorm_playing
    state:
    - 'off'
  actions:
  - if:
    - condition: trigger
      id:
      - sink_detected
    then: []
  - delay:
      hours: 0
      minutes: 0
      seconds: 1
      milliseconds: 0
  mode: single
- id: '1786456042655'
  alias: Hallway Occupancy Helper
  description: Manages helper boolean to keep track of hallway occupancy
  triggers:
  - trigger: motion.detected
    target:
      entity_id: binary_sensor.hallway_hallway_motion_sensor_2_motion
    options:
      behavior: each
      for: 00:00:00
    id: detected
  - trigger: motion.cleared
    target:
      entity_id: binary_sensor.hallway_hallway_motion_sensor_2_motion
    options:
      behavior: each
      for: 00:00:00
    id: cleared
  conditions: []
  actions:
  - if:
    - condition: trigger
      id:
      - cleared
    then:
    - action: input_boolean.turn_off
      metadata: {}
      target:
        entity_id: input_boolean.hallway_occupancy
      data: {}
    else:
    - action: input_boolean.turn_on
      metadata: {}
      target:
        entity_id: input_boolean.hallway_occupancy
      data: {}
  mode: single
