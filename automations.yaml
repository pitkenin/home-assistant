- id: '1786134612900'
  alias: Toilet Occupancy Helper
  description: Combines two sensors into one helper boolean to keep track of toilet
    occupancy
  triggers:
  - trigger: mqtt
    options:
      topic: zigbee2mqtt/Vibration Sensor
      value_template: '{{ value_json.action }}'
      payload: movement
  - trigger: occupancy.detected
    target:
      entity_id: binary_sensor.toilet_motion_sensor_occupancy
    options:
      behavior: each
      for: 00:00:00
  - trigger: occupancy.cleared
    target:
      entity_id: binary_sensor.toilet_motion_sensor_occupancy
    options:
      for: 00:00:00
    id: occupancy cleared
  conditions: []
  actions:
  - if:
    - condition: trigger
      id:
      - occupancy cleared
    then:
    - action: input_boolean.turn_off
      metadata: {}
      target:
        entity_id: input_boolean.toilet_occupancy
      data: {}
    else:
    - action: input_boolean.turn_on
      metadata: {}
      target:
        entity_id: input_boolean.toilet_occupancy
      data: {}
  mode: single
