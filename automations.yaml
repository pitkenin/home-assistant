    entity_id:
    - light.jungle_ceiling_light
    to:
    - 'on'
    id: light on
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - toilet
      sequence:
      - action: script.turn_on
        metadata: {}
        target:
          entity_id: script.jungle_easter_egg_selector
        data:
          variables:
            trigger_type: toilet
    - conditions:
      - condition: trigger
        id:
        - shower
      sequence:
      - action: script.turn_on
        metadata: {}
        target:
          entity_id: script.jungle_easter_egg_selector
        data:
          variables:
            trigger_type: shower
    - conditions:
      - condition: trigger
        id:
        - shower long
      sequence:
      - action: script.turn_on
        metadata: {}
        target:
          entity_id: script.jungle_easter_egg_selector
        data:
          variables:
            trigger_type: shower_long
    - conditions:
      - condition: trigger
        id:
        - sink
      sequence:
      - action: script.turn_on
        metadata: {}
        target:
          entity_id: script.jungle_easter_egg_selector
        data:
          variables:
            trigger_type: sink
    - conditions:
      - condition: trigger
        id:
        - light on
      sequence:
      - action: script.turn_on
        metadata: {}
        target:
          entity_id: script.jungle_easter_egg_selector
        data:
          variables:
            trigger_type: scroll_button
    - conditions:
      - condition: trigger
