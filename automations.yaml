    - conditions:
      - condition: trigger
        id:
        - on_single
      sequence:
      - if:
        - condition: not
          conditions:
          - condition: state
            entity_id: input_select.x_lighting_mode
            state:
            - Auto
        then:
        - action: light.turn_off
          metadata: {}
          target:
            entity_id: light.x_light
          data: {}
        - delay:
            hours: 0
            minutes: 0
            seconds: 0
            milliseconds: 100
      - action: light.turn_on
        metadata: {}
        target:
          entity_id:
          - light.x_light
        data: {}
      - action: input_select.select_option
        metadata: {}
        target:
          entity_id:
          - input_select.x_lighting_mode
        data:
          option: Auto
    - conditions:
      - condition: trigger
        id:
        - on_double
      sequence:
      - action: light.turn_on
        metadata: {}
        target:
          entity_id:
          - light.x_light
        data:
          color_temp_kelvin: 6500
          brightness_pct: 100
      - delay:
          hours: 0
          minutes: 0
          seconds: 0
          milliseconds: 100
      - action: light.turn_on
        metadata: {}
        target:
          entity_id:
          - light.x_light
        data:
          color_temp_kelvin: 6500
          brightness_pct: 100
      - action: input_select.select_option
        metadata: {}
        target:
          entity_id:
          - input_select.x_lighting_mode
        data:
          option: On (Timer)
    - conditions:
      - condition: trigger
        id:
        - off_long
        - on_long
      sequence:
      - action: button.press
        metadata: {}
        target:
          entity_id: button.xpc_obs_save_replay
        data: {}
  mode: restart
- id: '1775415056062'
  alias: Printer Ink Alert System
  description: Sends a persistent phone notification when the printer's ink level
    gets low.
  triggers:
  - entity_id:
    - sensor.epson_et_8550_series_c
    - sensor.epson_et_8550_series_gy
    - sensor.epson_et_8550_series_m
    - sensor.epson_et_8550_series_mb
    - sensor.epson_et_8550_series_pb
    - sensor.epson_et_8550_series_y
    below: 25
    id: send_alert
    trigger: numeric_state
  - entity_id:
    - sensor.epson_et_8550_series_c
    - sensor.epson_et_8550_series_gy
    - sensor.epson_et_8550_series_m
    - sensor.epson_et_8550_series_mb
    - sensor.epson_et_8550_series_pb
    - sensor.epson_et_8550_series_y
    above: 25
    id: clear_alert
    trigger: numeric_state
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: send_alert
      sequence:
      - action: input_boolean.turn_on
        metadata: {}
        target:
          entity_id: input_boolean.printer_ink_level_low
        data: {}
      - action: script.create_persistent_notification
        metadata: {}
        data:
          topic: X Notifications
          task_helper: input_boolean.printer_ink_level_low
          message: Ink level low. Please refill.
          title: Alert
    - conditions:
      - condition: trigger
        id: clear_alert
      sequence:
      - action: input_boolean.turn_off
        metadata: {}
        target:
          entity_id: input_boolean.printer_ink_level_low
        data: {}
  mode: single
- id: '1775427245179'
  alias: Persistent Notification Manager
  description: Resends notifications if swiped while task is incomplete
  triggers:
  - trigger: event
    event_type: mobile_app_notification_cleared
  conditions:
  - condition: template
    value_template: "{% set tag = trigger.event.data.tag %}\n{% if tag and ':' in
      tag %}\n  {% set helper = tag.split(':')[1] %}\n  {# Nag if: it's a 'Task' and
      is OFF, OR it's an 'Alert/Low' and is ON #}\n  {{ is_state(helper, 'on') }}\n{%
      else %}\n  false\n{% endif %}\n"
  actions:
  - action: ticker.notify
    data:
      category: '{{ trigger.event.data.tag.split('':'')[0] }}'
      title: '{{ trigger.event.data.title }}'
      message: '{{ trigger.event.data.message }}'
      data:
        tag: '{{ trigger.event.data.tag }}'
- id: '1775432947763'
  alias: X Light Off When in Bed
  description: Uses a vibration sensor under bed mattress to control lighting.
  triggers:
  - domain: mqtt
    device_id: 275da48458416a3803f1a7a6b29faeaf
    type: action
    subtype: movement
    trigger: device
  conditions:
  - condition: state
    entity_id: input_select.time_of_day_mode
    state:
    - Night
  actions:
  - action: light.turn_off
    metadata: {}
    target:
      entity_id: light.x_light
    data: {}
  mode: single
- id: '1775589257276'
  alias: Toilet Light Automation
  description: Controls toilet lighting based on time of day, triggered by vibration
    sensor on the door or a motion sensor on the wall.
  triggers:
  - trigger: mqtt
    options:
      topic: zigbee2mqtt/Vibration Sensor
      value_template: '{{ value_json.action }}'
      payload: movement
  - trigger: state
    entity_id: binary_sensor.toilet_motion_sensor_occupancy
    to: 'on'
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_select.time_of_day_mode
        state:
        - Night
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.toilet_light
        data:
          rgb_color:
          - 255
          - 157
          - 157
    default:
    - if:
      - condition: state
        entity_id: input_select.vibe_mode
        state:
        - Party
        - Sauna
        - Cozy Nook
        - Movie
      then:
      - action: light.turn_on
        target:
          entity_id: light.toilet_light
        data:
          rgb_color:
          - 255
          - 0
          - 0
      else:
      - action: light.turn_on
        target:
          entity_id: light.toilet_light
        data: {}
    - action: light.turn_on
      metadata: {}
      target:
        entity_id: light.toilet_cabinet_light
      data: {}
  - wait_template: '{{ is_state(''binary_sensor.toilet_motion_sensor_occupancy'',
      ''off'') }}'
  - delay:
      hours: 0
      minutes: 15
      seconds: 0
      milliseconds: 0
  - action: light.turn_off
    target:
      entity_id: light.toilet_lights
  mode: restart
- id: '1780311054979'
  alias: Boot Up
  description: Resets correct values used by other automations after a system restart.
  triggers:
  - trigger: homeassistant
    event: start
  actions:
  - if:
    - condition: state
      entity_id: binary_sensor.presence_sensor_fp2_1c80_presence_sensor_1
      state: 'off'
    then:
    - action: media_player.volume_set
      target:
        entity_id: media_player.janitor_primary
      data:
        volume_level: 0
  - action: input_boolean.turn_off
    metadata: {}
    target:
      entity_id: input_boolean.jungle_easter_egg_played
    data: {}
- id: '1782341081247'
  alias: Jungle Sound
  description: Controls primary and secondary audiostream based on bathroom presence
    and time of day. Creates a jungle-themed ambience in the bathroom with a few eastereggs.
  triggers:
  - trigger: state
    entity_id: binary_sensor.presence_sensor_fp2_1c80_presence_sensor_1
    to: 'on'
    id: room_entered
  - trigger: state
    entity_id: binary_sensor.presence_sensor_fp2_1c80_presence_sensor_1
    to: 'off'
    id: room_left
    for:
      hours: 0
      minutes: 0
      seconds: 10
  - trigger: state
    entity_id: binary_sensor.presence_sensor_fp2_1c80_presence_sensor_3
    to: 'on'
    id: toilet_occupied
  - trigger: state
    entity_id: binary_sensor.presence_sensor_fp2_1c80_presence_sensor_3
    to: 'off'
    id: toilet_vacant
  - trigger: state
    entity_id: input_select.time_of_day_mode
    id: time_changed
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: room_entered
      sequence:
      - choose:
        - conditions:
          - condition: state
            entity_id: media_player.janitor_primary
            state:
            - paused
            - 'off'
            - idle
          sequence:
          - action: media_player.media_play
            target:
              entity_id: media_player.janitor_primary
        - conditions:
          - condition: state
            entity_id: media_player.janitor_primary
            state: playing
          sequence: []
        default:
        - action: script.jungle_audio_select_playlist
          metadata: {}
          data: {}
      - action: script.universal_volume_fade
        metadata: {}
        data:
          duration_seconds: 1
          steps: 50
          target_player: media_player.janitor_primary
          target_volume: 0.5
    - conditions:
      - condition: trigger
        id: toilet_occupied
      - condition: state
        entity_id: input_boolean.jungle_easter_egg_played
        state: 'off'
      sequence:
      - action: media_player.repeat_set
        target:
          entity_id: media_player.janitor_secondary
        data:
          repeat: 'off'
      - action: media_player.shuffle_set
        target:
          entity_id: media_player.janitor_secondary
        data:
          shuffle: false
      - action: media_player.volume_set
        target:
          entity_id: media_player.janitor_secondary
        data:
          volume_level: 0
      - action: music_assistant.play_media
        target:
          entity_id: media_player.janitor_secondary
        data:
          media_id: Jungle Extra
          media_type: playlist
          enqueue: replace
      - action: script.universal_volume_fade
        metadata: {}
        data:
          duration_seconds: 5
          steps: 50
          target_player: media_player.janitor_secondary
          target_volume: 0.42
      - action: script.universal_volume_fade
        metadata: {}
        data:
          duration_seconds: 5
          steps: 50
          target_player: media_player.janitor_primary
          target_volume: 0.45
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.jungle_easter_egg_played
    - conditions:
      - condition: trigger
        id: toilet_vacant
      sequence:
      - action: script.universal_volume_fade
        metadata: {}
        data:
          duration_seconds: 5
          steps: 50
          target_player: media_player.janitor_secondary
          target_volume: 0
      - action: media_player.media_stop
        target:
          entity_id: media_player.janitor_secondary
        data: {}
      - choose:
        - conditions:
          - condition: state
            entity_id: binary_sensor.presence_sensor_fp2_1c80_presence_sensor_1
            state:
            - 'on'
          sequence:
          - action: script.universal_volume_fade
            metadata: {}
            data:
              duration_seconds: 5
              steps: 50
              target_player: media_player.janitor_primary
              target_volume: 0.5
        default:
        - action: script.universal_volume_fade
          metadata: {}
          data:
            duration_seconds: 5
            steps: 50
            target_player: media_player.janitor_primary
            target_volume: 0
        - action: media_player.media_stop
          target:
            entity_id: media_player.janitor_primary
    - conditions:
      - condition: trigger
        id: room_left
      sequence:
      - action: script.universal_volume_fade
        metadata: {}
        data:
          duration_seconds: 2.5
          steps: 50
          target_player: media_player.janitor_primary
          target_volume: 0
      - action: media_player.media_stop
        target:
          entity_id: media_player.janitor_primary
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.jungle_easter_egg_played
    - conditions:
      - condition: trigger
        id: time_changed
      sequence:
      - action: script.jungle_audio_select_playlist
        metadata: {}
        data: {}
      - choose:
        - conditions:
          - condition: state
            entity_id: binary_sensor.presence_sensor_fp2_1c80_presence_sensor_1
            state: 'off'
          sequence:
          - action: media_player.media_stop
            target:
              entity_id: media_player.janitor_primary
  mode: queued
  max: 5
- id: '1784909281271'
  alias: Janitor Speakers Self-Heal (SSH Restart + MA Reload)
  description: Tries to restore bathroom speaker system following a malfunction and
    sends a notification.
  triggers:
  - trigger: state
    entity_id: media_player.janitor_primary
    to: unavailable
    for:
      minutes: 3
    id: primary_unavailable
  - trigger: state
    entity_id:
    - media_player.janitor_secondary
    to:
    - unavailable
    for:
      minutes: 3
    id: secondary_unavailable
  conditions: []
  actions:
  - action: ticker.notify
    metadata: {}
    data:
      actions: category_default
      category: X Notifications
      title: PROBLEM
      message: Janitor speakers are malfunctioning.
  - choose:
    - conditions:
      - condition: trigger
        id:
        - primary_unavailable
      sequence:
      - action: shell_command.reboot_janitor_speaker
        data: {}
    - conditions:
      - condition: trigger
        id:
        - secondary_unavailable
      sequence:
      - action: shell_command.reboot_janitor_speaker_secondary
        data: {}
  - action: homeassistant.reload_config_entry
    target:
      entity_id: media_player.janitor_primary
  mode: queued
  max: 3
- id: '1785082621461'
  alias: Home Assistant Auto-update on a schedule base v2026.6.0
  description: Automatic updates
  use_blueprint:
    path: edwardtfn/auto_update_scheduled.yaml
    input:
      schedule_entity: schedule.ha_update_window
- id: '1785574877698'
  alias: Shopping List Reminder
  description: Sends a phone notification when phone enters a grocery store area.
  triggers:
  - trigger: state
    entity_id:
    - person.aksu
    to:
    - Main Grocery Store
    - 24h Store
    - Nearby Shopping Center
    for:
      hours: 0
      minutes: 1
      seconds: 0
  - trigger: template
    value_template: '{{ states(''input_text.car_bt_mac'') in (state_attr(''sensor.x_phone_bluetooth_connection'',
      ''connected_paired_devices'') | string) }}'
  conditions:
  - condition: todo.incomplete
    target:
      entity_id: todo.shopping_list
    options:
      for: 00:00:00
      threshold:
        type: above
        value:
          active_choice: number
          number: 0
  - condition: not
    conditions:
    - condition: template
      value_template: '{{ states(''sensor.x_phone_wi_fi_connection'') == states(''input_text.home_ssid'')
        }}'
  actions:
  - action: todo.get_items
    metadata: {}
    target:
      entity_id: todo.shopping_list
    data:
      status: needs_action
    response_variable: my_shopping_list
  - action: ticker.notify
    metadata: {}
    data:
      actions: category_default
      category: X Notifications
      title: Shopping List Reminder
      message: "{% for item in my_shopping_list['todo.shopping_list']['items'] %}\n
        \         • {{ item.summary }}\n{% endfor %}"
  mode: single
- id: '1785603288738'
  alias: Daily config export to Git
  description: Starts the Git Exporter add-on once a day. The add-on is one-shot,
    so without this it would only ever run on Home Assistant restart, and the public
    README would go stale.
  triggers:
  - trigger: time
    at: 04:00:00
  actions:
  - action: hassio.addon_start
    data:
      addon: 68413af6_git-exporter
  mode: single
