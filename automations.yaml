- id: '1791297856150'
  alias: Automatic morning alarm planner
  description: Refreshes selected Google calendars, asks Gemini to plan wake-up alarms,
    creates the alarms on Android, and reports the result.
  triggers:
  - trigger: time
    at: '20:00:00'
  conditions: []
  actions:
  - action: homeassistant.update_entity
    data:
      entity_id:
      - calendar.tapahtumat
      - calendar.roi
  - action: calendar.get_events
    target:
      entity_id:
      - calendar.tapahtumat
      - calendar.roi
    data:
      start_date_time: '{{ now().isoformat() }}'
      end_date_time: '{% set end = today_at(''15:00'') %} {{ (end + timedelta(days=1)
        if now() >= end else end).isoformat() }}'
    response_variable: agenda
  - condition: template
    value_template: "{{ state_attr('sensor.automatic_alarm_private_context', 'context')\n
      \  not in [none, '', 'unknown', 'unavailable'] }}"
  - action: ai_task.generate_data
    data:
      entity_id: ai_task.google_ai_task
      task_name: Automatic wake-up alarm planner
      instructions: 'You are an automatic wake-up alarm planning system.


        CURRENT LOCAL DATE AND TIME:

        {{ now() }}


        PRIVATE USER CONTEXT:

        {{ state_attr(''sensor.automatic_alarm_private_context'', ''context'') }}


        UPCOMING CALENDAR DATA:

        {{ agenda | to_json(pretty_print=true) }}


        TASK


        Determine whether the user needs one or more wake-up alarms based on

        the private user context and the supplied calendar events.


        Only calendar.tapahtumat and calendar.roi have intentionally been

        supplied. Do not assume anything about other calendars.


        Consider:

        - which calendar an event belongs to

        - event title

        - event start and end time

        - event description, when available

        - event location, when available

        - preparation time

        - likely travel requirements

        - whether an event genuinely requires waking up

        - whether there may be multiple separate sleep periods


        The user may occasionally need to wake during the night for one

        commitment, return home, and go back to sleep. A later morning

        commitment can therefore require another independent alarm.


        Never assume that an earlier overnight alarm means the user will stay

        awake afterwards.


        ALARM RULES


        Create an alarm only when there is a realistic possibility that the

        user might otherwise be asleep when preparation needs to begin.


        Each alarm should leave enough time for:

        - getting ready

        - required travel

        - any appropriate safety margin described in the private context


        If an event is online, do not add travel time.


        Prefer an unnecessary or somewhat too-early alarm over risking missing

        an important commitment.


        Never create an alarm whose next occurrence would be outside the

        supplied planning period.


        Return at most three independent alarms.


        Put used alarm slots in chronological order.


        For every unused alarm slot:

        - needed = false

        - time = 00:00:00

        - label = Unused


        UNCERTAINTY / MANUAL REVIEW


        manual_review_needed means the automation should still complete, but

        the user should personally inspect the chosen alarms.


        manual_review_needed does NOT mean that alarms should automatically be

        omitted.


        When information is somewhat uncertain but a reasonably safe alarm can

        still be chosen, create a conservative alarm AND set

        manual_review_needed = true.


        Prefer choosing an alarm somewhat too early rather than too late.


        Only omit an alarm because of uncertainty if there is genuinely no

        reasonable safe alarm time to choose.


        If no meaningful uncertainty exists:

        - manual_review_needed = false

        - manual_review_reason = None


        decision_summary should briefly explain why the alarms were selected or

        why no alarms were necessary.'
      structure:
        alarm_1_needed:
          description: Whether the first wake-up alarm is required.
          required: true
          selector:
            boolean:
        alarm_1_time:
