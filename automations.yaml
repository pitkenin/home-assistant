        metadata: {}
        target:
          entity_id: input_boolean.toilet_ceiling_light_auto_mode
        data: {}
    - conditions:
      - condition: state
        entity_id: input_boolean.toilet_sink_light_timer_active
        state:
        - 'on'
      - condition: time
        after: input_datetime.toilet_sink_light_manual_expiration
      sequence:
      - action: input_boolean.turn_off
        metadata: {}
        target:
          entity_id: input_boolean.toilet_sink_light_timer_active
        data: {}
      - action: input_boolean.turn_on
        metadata: {}
        target:
          entity_id: input_boolean.toilet_sink_light_auto_mode
        data: {}
- id: '1782341081247'
  alias: Jungle Sound
  description: Controls primary and secondary audiostream based on bathroom presence
    and time of day.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.jungle_presence
    to: 'on'
    id: room_entered
  - trigger: state
    entity_id:
    - binary_sensor.jungle_presence
    to: 'off'
    for:
      seconds: 2
    id: room_left
  - trigger: state
    entity_id:
    - binary_sensor.jungle_toilet_presence
    to: 'on'
    id: toilet_occupied
  - trigger: state
    entity_id:
    - binary_sensor.jungle_toilet_presence
    to: 'off'
    id: toilet_vacant
  - trigger: state
    entity_id:
    - binary_sensor.jungle_shower_presence
    to:
    - 'on'
    for:
      hours: 0
      minutes: 0
      seconds: 20
    id: shower_occupied
  - trigger: state
    entity_id:
    - binary_sensor.jungle_shower_presence
    to:
    - 'off'
    for:
      hours: 0
      minutes: 0
      seconds: 5
    id: shower_vacant
  - trigger: state
    entity_id: input_select.time_of_day_mode
    id: time_changed
  conditions:
  - condition: state
    entity_id: input_boolean.jungle_music
    state: 'on'
  actions:
  - variables:
      ambient_id: '{% set mode = states(''input_select.time_of_day_mode'') %} {% if
        mode == ''Morning'' %} Jungle Morning {% elif mode == ''Day'' %} Jungle Day
        {% else %} Jungle Night {% endif %}

        '
  - choose:
    - conditions:
      - condition: trigger
        id:
        - room_entered
      sequence:
      - action: script.jungle_audio_controller
        data:
          action: play
          category: ambient
          sound_id: '{{ ambient_id }}'
          volume_ratio: 1
    - conditions:
      - condition: trigger
        id:
        - time_changed
      sequence:
      - if:
        - condition: state
          entity_id: binary_sensor.jungle_presence
          state: 'on'
        then:
        - action: script.jungle_audio_controller
          data:
            action: play
            category: ambient
            sound_id: '{{ ambient_id }}'
            volume_ratio: 1
        else:
        - action: script.jungle_audio_controller
          data:
            action: play
            category: ambient
            sound_id: '{{ ambient_id }}'
            volume_ratio: 0
    - conditions:
      - condition: trigger
        id: toilet_occupied
      - condition: state
        entity_id: input_boolean.jungle_easter_egg_played
        state: 'off'
      sequence:
      - action: script.jungle_audio_controller
        data:
          action: play
          category: easter_egg
          sound_id: Terraria Jungle
          volume_ratio: 0.5
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.jungle_easter_egg_played
    - conditions:
      - condition: trigger
        id:
        - shower_occupied
      - condition: state
        entity_id: input_boolean.enable_thunderstorm
        state:
        - 'on'
      sequence:
      - action: input_number.set_value
        metadata: {}
        target:
          entity_id: input_number.jungle_target_volume
        data:
          value: 0.7
      - action: script.jungle_audio_controller
        metadata: {}
        data:
          volume_ratio: 1
          forceplay: true
          action: play
          category: ambient
          sound_id: '{{ states(''input_text.jungle_ambient_sound'') ~ '' Rain'' }}'
      - action: input_boolean.turn_on
        metadata: {}
        target:
          entity_id: input_boolean.thunderstorm_playing
        data: {}
      - action: script.play_thunderstorm
        metadata: {}
        data: {}
    - conditions:
      - condition: trigger
        id:
        - shower_vacant
      sequence:
      - action: input_number.set_value
        metadata: {}
        target:
          entity_id: input_number.jungle_target_volume
        data:
          value: 0.5
      - action: script.jungle_audio_controller
        metadata: {}
        data:
          volume_ratio: 1
          forceplay: true
          action: play
          category: ambient
          sound_id: '{{ states(''input_text.jungle_ambient_sound'') | replace('' Rain'',
            '''') }}'
      - action: input_boolean.turn_off
        metadata: {}
        target:
          entity_id: input_boolean.thunderstorm_playing
        data: {}
    - conditions:
      - condition: trigger
        id: toilet_vacant
      sequence:
      - action: script.jungle_audio_controller
        data:
          action: stop
          category: easter_egg
    - conditions:
      - condition: trigger
        id: room_left
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.jungle_easter_egg_played
      - action: script.jungle_audio_controller
        data:
          action: stop
          category: ambient
  mode: queued
  max: 5
- id: '1784909281271'
  alias: Janitor Speakers Self-Heal (SSH Restart + MA Reload)
  description: ' If speakers malfunction, tries to restore bathroom speaker system
    following a malfunction and sends a notification.'
  triggers:
  - trigger: state
    entity_id:
    - media_player.janitor_primary
    - media_player.janitor_secondary
    to: unavailable
    for: 00:03:00
    id: went_unavailable
  - trigger: time_pattern
    minutes: /5
    id: periodic
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: media_player.janitor_primary
      state: unavailable
      for: 00:03:00
    - condition: state
      entity_id: media_player.janitor_secondary
      state: unavailable
      for: 00:03:00
  actions:
  - action: ticker.notify
    data:
      actions: category_default
      category: X Notifications
      title: PROBLEM
      message: Janitor speakers are malfunctioning.
  - if:
    - condition: state
      entity_id: media_player.janitor_primary
      state: unavailable
    then:
    - action: shell_command.reboot_janitor_speaker
  - if:
    - condition: state
      entity_id: media_player.janitor_secondary
      state: unavailable
    then:
    - action: shell_command.reboot_janitor_speaker_secondary
  - action: homeassistant.reload_config_entry
    target:
      entity_id: media_player.janitor_primary
  mode: queued
  max: 5
