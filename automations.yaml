- id: '1774193753994'
  alias: Detect Laundry Cycle
  description: Detect when the laundry machine has begun operating
  triggers:
  - type: power
    device_id: c71a78605d8b0577bc3fc2c1cd328618
    entity_id: a37419e40c4fd79adabe791a9564e3e1
    domain: sensor
    trigger: device
    above: 1000
  conditions:
  - condition: state
    entity_id: input_boolean.laundry_cycle_active
    state:
    - 'off'
  actions:
  - action: input_boolean.turn_on
    metadata: {}
    target:
      entity_id: input_boolean.laundry_cycle_active
    data: {}
  mode: single
- id: '1774194768683'
  alias: Notify When Laundry is Ready
  description: Send a phone notification when laundry machine is idle after operation.
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.laundry_machine_power
    for:
      hours: 0
      minutes: 2
      seconds: 0
    below: 10
  conditions:
  - condition: state
    entity_id: input_boolean.laundry_cycle_active
    state:
    - 'on'
  actions:
  - action: input_boolean.turn_off
    metadata: {}
    target:
      entity_id: input_boolean.laundry_cycle_active
    data: {}
  - alias: Send notification to correct User
    choose:
    - conditions:
      - condition: state
        entity_id: input_select.laundry_machine_user
        state:
        - Aksu
      sequence:
      - action: ticker.notify
        metadata: {}
        data:
          category: X Notifications
          message: 'Laundry is ready!

            HUOM: KÄÄNNÄ KAHVA'
          title: ' '
    - conditions:
      - condition: state
        entity_id: input_select.laundry_machine_user
        state:
        - Seba
      sequence:
      - action: ticker.notify
        metadata: {}
        data:
          category: Seba Notifications
          message: 'Laundry is ready!

            HUOM: KÄÄNNÄ KAHVA'
          title: ' '
    - conditions:
      - condition: state
        entity_id: input_select.laundry_machine_user
        state:
        - nobolonski
      sequence:
      - action: ticker.notify
        metadata: {}
        data:
          category: General
          message: 'Joku nobolonski unohti painaa nappia mut siis pyykit on done.

            HUOM: KÄÄNNÄ KAHVA'
          title: '  '
  - action: input_select.select_option
    metadata: {}
    target:
      entity_id: input_select.laundry_machine_user
    data:
      option: nobolonski
    alias: Reset User
  mode: single
- id: '1774196799531'
  alias: Jungle 2-Buttons
  description: Maps buttons (2 buttons) to different users of the laundry machine
    for future notification. Additionally controls bathroom sounds with alternative
    inputs.
  triggers:
  - domain: mqtt
    device_id: 7f560e17593e674ffc8d2195c1adb9e1
    type: action
    subtype: 'on'
    trigger: device
    id: aksu
  - domain: mqtt
    device_id: 7f560e17593e674ffc8d2195c1adb9e1
    type: action
    subtype: 'off'
    trigger: device
    id: seba
  - domain: mqtt
    device_id: 7f560e17593e674ffc8d2195c1adb9e1
    type: action
    subtype: on_double
    trigger: device
    id: secondary
  - domain: mqtt
    device_id: 7f560e17593e674ffc8d2195c1adb9e1
    type: action
    subtype: off_double
    trigger: device
    id: secondary
  - domain: mqtt
    device_id: 7f560e17593e674ffc8d2195c1adb9e1
    type: action
    subtype: brightness_move_up
    trigger: device
    id: reset user
  - domain: mqtt
    device_id: 7f560e17593e674ffc8d2195c1adb9e1
    type: action
    subtype: brightness_move_down
    trigger: device
    id: reset user
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - aksu
      sequence:
      - action: input_select.select_option
        metadata: {}
        target:
          entity_id: input_select.laundry_machine_user
        data:
          option: Aksu
    - conditions:
      - condition: trigger
        id:
        - seba
      sequence:
      - action: input_select.select_option
        metadata: {}
        target:
          entity_id: input_select.laundry_machine_user
        data:
          option: Seba
    - conditions:
      - condition: trigger
        id:
        - reset user
      sequence:
      - action: input_select.select_option
        metadata: {}
        target:
          entity_id: input_select.laundry_machine_user
        data:
          option: nobolonski
      - action: script.turn_on
        target:
          entity_id: script.jungle_audio_controller
        data:
          variables:
            action: stop
            category: easter_egg
      - action: input_boolean.turn_on
        metadata: {}
        target:
          entity_id:
          - input_boolean.jungle_easter_egg_played
          - input_boolean.jungle_special_easter_egg_played
        data: {}
    - conditions:
      - condition: trigger
        id:
        - secondary
      sequence:
      - action: script.jungle_easter_egg_selector
        metadata: {}
        data:
          trigger_type: admin
