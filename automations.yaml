- id: '1774199438030'
  alias: (OLD) Hallway Lighting Reset to Auto Mode
  description: Resets the control mode of the hallway lights to Auto after manual
    input.
  triggers:
  - trigger: state
    entity_id:
    - input_select.hallway_lighting_mode
    to:
    - Timer
    for:
      hours: 2
      minutes: 0
      seconds: 0
    id: timer
  - trigger: state
    entity_id:
    - input_select.time_of_day_mode
    to:
    - Morning
    id: morning
  conditions:
  - condition: or
    conditions:
    - condition: and
      conditions:
      - condition: state
        entity_id: input_select.hallway_lighting_mode
        state:
        - Timer
      - condition: trigger
        id:
        - timer
    - condition: and
      conditions:
      - condition: state
        entity_id: input_select.hallway_lighting_mode
        state:
        - Morning
      - condition: trigger
        id:
        - morning
  actions:
  - if:
    - condition: state
      entity_id: input_select.vibe_mode
      state:
      - Maintenance
    then:
    - action: input_select.select_option
      metadata: {}
      target:
        entity_id: input_select.hallway_lighting_mode
      data:
        option: Infinite
    else:
    - action: input_select.select_option
      metadata: {}
      target:
        entity_id: input_select.hallway_lighting_mode
      data:
        option: Auto
    - condition: state
      state:
      - 'on'
      entity_id: light.hallway_lights
    - action: automation.trigger
      metadata: {}
      target:
        entity_id: automation.hallway_lights_automation
      data:
        skip_condition: false
  mode: restart
