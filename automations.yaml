        metadata: {}
        target:
          entity_id: light.kitchen_lights
        data: {}
      - action: script.set_manual_mode_timer
        metadata: {}
        data:
          mode: Time
          auto_mode_helper: input_boolean.kitchen_lights_auto_mode
          timer_active_helper: input_boolean.kitchen_lights_timer_active
          expiration_helper: input_datetime.kitchen_lights_manual_expiration
          time: 07:00:00
    - conditions:
      - condition: trigger
        id:
