- id: '1790975892463'
  alias: 'Shopping List: Notifications & Management'
  description: Sends silent shopping list notifications upon arrival, clears them
    on exit, and handles Mark Done actions.
  triggers:
  - trigger: state
    id: arrived_store
    entity_id: person.aksu
    to:
    - Main Grocery Store
    - 24h Store
    - Nearby Shopping Center
    for:
      seconds: 15
  - trigger: state
    id: left_store
    entity_id:
    - person.aksu
    from:
    - Main Grocery Store
    - 24h Store
    - Nearby Shopping Center
    for:
      hours: 0
      minutes: 1
      seconds: 0
  - trigger: event
    id: mark_done
    event_type: mobile_app_notification_action
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: arrived_store
      - condition: todo.incomplete
        target:
          entity_id: todo.shopping_list
        options:
          for: 00:00:00
          threshold:
            type: above
            value:
              active_choice: number
              number: 0
      - condition: not
        conditions:
        - condition: template
          value_template: '{{ states(''sensor.x_phone_wi_fi_connection'') == states(''input_text.home_ssid'')
            }}'
      sequence:
      - action: todo.get_items
        target:
          entity_id: todo.shopping_list
        data:
          status: needs_action
        response_variable: current_list
      - repeat:
          for_each: '{{ current_list[''todo.shopping_list''][''items''] }}'
          sequence:
          - action: notify.mobile_app_x_phone
            data:
              message: "\U0001F6D2 {{ repeat.item.summary }}"
              data:
                channel: Shopping Reminders
                importance: default
                group: Shopping List Reminder
                tag: '{{ repeat.item.summary }}'
                actions:
                - action: MARK_DONE_{{ repeat.item.summary }}
                  title: Mark Done
    - conditions:
      - condition: trigger
        id: mark_done
      - condition: template
        value_template: '{{ trigger.event.data.action.startswith(''MARK_DONE_'') }}'
      sequence:
      - variables:
          item_name: '{{ trigger.event.data.action | replace(''MARK_DONE_'', '''')
            }}'
      - action: todo.remove_item
        target:
          entity_id: todo.shopping_list
        data:
          item: '{{ item_name }}'
      - action: notify.mobile_app_x_phone
        data:
          message: clear_notification
          data:
            tag: '{{ item_name }}'
    - conditions:
      - condition: trigger
        id: left_store
      sequence:
      - action: todo.get_items
        target:
          entity_id: todo.shopping_list
        data:
          status:
          - needs_action
          - completed
        response_variable: exit_list
      - repeat:
          for_each: '{{ exit_list[''todo.shopping_list''][''items''] }}'
          sequence:
          - action: notify.mobile_app_x_phone
            data:
              message: clear_notification
              data:
                tag: '{{ repeat.item.summary }}'
