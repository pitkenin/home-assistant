- id: '1786199208134'
  alias: 'Test: Thunderstorm Lightning Strike (Fast)'
  triggers: []
  actions:
  - repeat:
      count: '{{ range(min_flashes, max_flashes + 1) | random }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: '{{ target_light }}'
        data:
          brightness: 70
          color_temp_kelvin: '{{ flash_color_temp }}'
          transition: 0
      - delay:
          milliseconds: '{{ range(min_delay_ms, max_delay_ms) | random }}'
      - action: light.turn_on
        target:
          entity_id: '{{ target_light }}'
        data:
          brightness: 1
          transition: 0
      - delay:
          milliseconds: '{{ range(min_delay_ms, max_delay_ms) | random }}'
  - action: light.turn_off
    target:
      entity_id: '{{ target_light }}'
    data:
      transition: 0
  mode: single
  variables:
    target_light: light.monkey_light
    flash_color_temp: 3000
    min_flashes: 3
    max_flashes: 6
    min_delay_ms: 40
    max_delay_ms: 120
