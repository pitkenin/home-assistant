- id: '1785574877698'
  alias: Shopping List Reminder
  description: Sends grouped phone notifications for grocery items.
  triggers:
  - trigger: state
    entity_id:
    - person.aksu
    to:
    - Main Grocery Store
    - 24h Store
    - Nearby Shopping Center
    for:
      hours: 0
      minutes: 1
      seconds: 0
  - trigger: template
    value_template: '{{ states(''input_text.car_bt_mac'') in (state_attr(''sensor.x_phone_bluetooth_connection'',
      ''connected_paired_devices'') | string) }}'
    enabled: false
  conditions:
  - condition: todo.incomplete
    target:
      entity_id: todo.shopping_list
    options:
      for: 00:00:00
      threshold:
        type: above
        value:
          active_choice: number
          number: 0
  - condition: not
    conditions:
    - condition: template
      value_template: '{{ states(''sensor.x_phone_wi_fi_connection'') == states(''input_text.home_ssid'')
        }}'
  actions:
  - action: todo.get_items
    metadata: {}
    target:
      entity_id: todo.shopping_list
    data:
      status: needs_action
    response_variable: my_shopping_list
  - repeat:
      for_each: '{{ my_shopping_list[''todo.shopping_list''][''items''] }}'
      sequence:
      - action: notify.mobile_app_x_phone
        data:
          message: "\U0001F6D2 {{ repeat.item.summary }}"
          data:
            group: Shopping List Reminder
            tag: '{{ repeat.item.summary }}'
            actions:
            - action: MARK_DONE_{{ repeat.item.summary }}
              title: Mark Done
  - wait_for_trigger:
    - trigger: state
      entity_id: person.aksu
      from:
      - Main Grocery Store
      - 24h Store
      - Nearby Shopping Center
      for:
        minutes: 3
  - repeat:
      for_each: '{{ my_shopping_list[''todo.shopping_list''][''items''] }}'
      sequence:
      - action: notify.mobile_app_x_phone
        data:
          message: clear_notification
          data:
            tag: '{{ repeat.item.summary }}'
  mode: single
- id: '1785603288738'
  alias: Daily config export to Git
  description: Starts the Git Exporter add-on once a day. The add-on is one-shot,
    so without this it would only ever run on Home Assistant restart, and the public
    README would go stale.
  triggers:
  - trigger: time
    at: 04:00:00
  actions:
  - action: hassio.addon_start
    data:
      addon: 68413af6_git-exporter
  mode: single
- id: '1785760445178'
  alias: 'Shopping List: Mark Item Done from Notification'
  description: Listens for notification actions and updates the to-do list.
  triggers:
  - trigger: event
    event_type: mobile_app_notification_action
  conditions:
  - condition: template
    value_template: '{{ trigger.event.data.action.startswith(''MARK_DONE_'') }}'
  actions:
  - action: todo.remove_item
    target:
      entity_id: todo.shopping_list
    data:
      item: '{{ trigger.event.data.action | replace(''MARK_DONE_'', '''') }}'
  mode: parallel
