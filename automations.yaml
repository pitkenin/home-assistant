  - delay: 00:01:00
  - if:
    - condition: template
      value_template: "{% set last_success =\n    as_timestamp(\n      states('input_datetime.automatic_alarm_last_success'),\n
        \     0\n    )\n%}\n{% if now() >= today_at('20:00') %}\n  {% set expected
        =\n      as_timestamp(today_at('19:50'))\n  %}\n  {{ last_success < expected
        }}\n\n{% elif now() < today_at('15:00') %}\n  {% set expected =\n      as_timestamp(\n
        \       today_at('19:50') - timedelta(days=1)\n      )\n  %}\n  {{ last_success
        < expected }}\n\n{% else %}\n  false\n{% endif %}"
    then:
    - action: automation.trigger
      target:
        entity_id: automation.automatic_morning_alarm_planner
    - wait_template: "{% set last_success =\n    as_timestamp(\n      states('input_datetime.automatic_alarm_last_success'),\n
        \     0\n    )\n%}\n{% if now() >= today_at('20:00') %}\n  {% set expected
        =\n      as_timestamp(today_at('19:50'))\n  %}\n{% else %}\n  {% set expected
        =\n      as_timestamp(\n        today_at('19:50') - timedelta(days=1)\n      )\n
        \ %}\n{% endif %}\n{{ last_success >= expected }}"
      timeout: 00:03:00
      continue_on_timeout: true
    - if:
      - condition: template
        value_template: "{% set last_success =\n    as_timestamp(\n      states('input_datetime.automatic_alarm_last_success'),\n
          \     0\n    )\n%}\n{% if now() >= today_at('20:00') %}\n  {% set expected
          =\n      as_timestamp(today_at('19:50'))\n  %}\n{% else %}\n  {% set expected
          =\n      as_timestamp(\n        today_at('19:50') - timedelta(days=1)\n
          \     )\n  %}\n{% endif %}\n{{ last_success < expected }}"
      then:
      - action: notify.mobile_app_x_phone
        data:
          title: ⚠️ Automatic alarm problem
          message: Home Assistant restarted after the normal alarm check was missed,
            and automatic recovery did not complete successfully. Please check your
            calendar and alarms manually.
          data:
            ttl: 0
            priority: high
- id: '1782341081247'
  alias: Jungle Ambient Handler
  description: Controls ambient soundtrack based on bathroom occupancy and time of
    day.
  triggers:
  - trigger: state
    entity_id:
    - input_boolean.jungle_occupancy
    id: room_entered
    to:
    - 'on'
  - trigger: state
    entity_id:
    - input_boolean.jungle_occupancy
    to:
    - 'off'
    id: room_left
  - trigger: state
    entity_id: input_select.time_of_day_mode
    id: time_changed
  - trigger: state
    entity_id:
    - input_boolean.thunderstorm_playing
    to:
    - 'on'
    id: start thunderstorm
  - trigger: state
    entity_id:
    - input_boolean.thunderstorm_playing
    to:
    - 'off'
    id: end thunderstorm
  conditions:
  - condition: or
    conditions:
    - condition: and
      conditions:
      - condition: state
        entity_id: input_boolean.jungle_music
        state: 'on'
      - condition: trigger
        id:
        - room_entered
        - time_changed
        - start thunderstorm
    - condition: trigger
      id:
      - room_left
      - end thunderstorm
  actions:
  - variables:
      ambient_id: '{% set mode = states(''input_select.time_of_day_mode'') %} {% if
        mode == ''Morning'' %} Jungle Morning {% elif mode == ''Day'' %} Jungle Day
        {% else %} Jungle Night {% endif %}

        '
  - choose:
    - conditions:
      - condition: trigger
        id:
        - room_entered
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.jungle_audio_controller
        data:
          variables:
            action: play
            category: ambient
            sound_id: '{{ ambient_id }}'
            volume_ratio: 1
    - conditions:
      - condition: trigger
        id:
        - time_changed
      - condition: state
        entity_id: input_boolean.thunderstorm_playing
        state:
        - 'off'
      sequence:
      - if:
        - condition: state
          entity_id: binary_sensor.jungle_presence
          state: 'on'
        then:
        - action: script.turn_on
          target:
            entity_id: script.jungle_audio_controller
          data:
            variables:
              action: play
              category: ambient
              sound_id: '{{ ambient_id }}'
              volume_ratio: 1
        else:
        - action: script.turn_on
          target:
            entity_id: script.jungle_audio_controller
          data:
            variables:
              action: play
              category: ambient
              sound_id: '{{ ambient_id }}'
              volume_ratio: 0
    - conditions:
      - condition: trigger
        id:
        - start thunderstorm
      sequence:
      - action: automation.trigger
        metadata: {}
        target:
          entity_id: automation.adjust_jungle_target_volume
        data:
          skip_condition: true
      - action: script.turn_on
        target:
          entity_id: script.jungle_audio_controller
        data:
          variables:
            volume_ratio: 1
            forceplay: true
            action: play
            category: ambient
            sound_id: '{{ states(''input_text.jungle_ambient_sound'') | replace(''
              Rain'', '''') ~ '' Rain'' }}'
      - action: script.turn_on
        target:
          entity_id: script.play_thunderstorm
        data: {}
    - conditions:
      - condition: trigger
        id:
        - end thunderstorm
      sequence:
      - action: automation.trigger
        metadata: {}
        target:
          entity_id: automation.adjust_jungle_target_volume
        data:
          skip_condition: true
      - action: script.turn_on
        target:
          entity_id: script.jungle_audio_controller
        metadata: {}
        data:
          variables:
            volume_ratio: 1
            forceplay: true
            action: play
            category: ambient
            sound_id: '{{ states(''input_text.jungle_ambient_sound'') | replace(''
              Rain'', '''') }}'
    - conditions:
      - condition: trigger
        id: room_left
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id:
          - input_boolean.jungle_easter_egg_played
          - input_boolean.jungle_special_easter_egg_played
        data: {}
      - action: script.turn_on
        target:
          entity_id: script.jungle_audio_controller
        data:
          variables:
            action: stop
            category: ambient
      - action: script.turn_on
        target:
          entity_id: script.jungle_audio_controller
        data:
          variables:
            action: play
            category: ambient
            sound_id: '{{ ambient_id }}'
            volume_ratio: 0
            skip_fade_in: true
  mode: queued
  max: 10
