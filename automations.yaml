    response_variable: alarm_plan
  - condition: template
    value_template: "{% if not (alarm_plan.data.alarm_1_needed | bool) %}\n  true\n{%
      elif alarm_plan.data.alarm_1_time == '00:00:00' %}\n  false\n{% else %}\n  {%
      set alarm_today = today_at(alarm_plan.data.alarm_1_time) %}\n  {% set alarm_datetime
      =\n       alarm_today if alarm_today > now()\n       else alarm_today + timedelta(days=1)
      %}\n  {{ alarm_datetime <= today_at('15:00') + timedelta(days=1) }}\n{% endif
      %}"
  - condition: template
    value_template: "{% if not (alarm_plan.data.alarm_2_needed | bool) %}\n  true\n{%
      elif alarm_plan.data.alarm_2_time == '00:00:00' %}\n  false\n{% else %}\n  {%
      set alarm_today = today_at(alarm_plan.data.alarm_2_time) %}\n  {% set alarm_datetime
      =\n       alarm_today if alarm_today > now()\n       else alarm_today + timedelta(days=1)
      %}\n  {{ alarm_datetime <= today_at('15:00') + timedelta(days=1) }}\n{% endif
      %}"
  - condition: template
    value_template: "{% if not (alarm_plan.data.alarm_3_needed | bool) %}\n  true\n{%
