      %}\n  {{ alarm_datetime <= today_at('15:00') + timedelta(days=1) }}\n{% endif
      %}"
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ alarm_plan.data.alarm_1_needed | bool }}'
      sequence:
      - action: notify.mobile_app_x_phone
        data:
          message: command_activity
          data:
            intent_action: android.intent.action.SET_ALARM
            intent_extras: android.intent.extra.alarm.HOUR:{{ alarm_plan.data.alarm_1_time.split(':')[0]
              | int }},android.intent.extra.alarm.MINUTES:{{ alarm_plan.data.alarm_1_time.split(':')[1]
              | int }},android.intent.extra.alarm.MESSAGE:{{ ('HA - ' ~ alarm_plan.data.alarm_1_label)
              | urlencode }}:String.urlencoded,android.intent.extra.alarm.SKIP_UI:true
  - delay:
      seconds: 10
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ alarm_plan.data.alarm_2_needed | bool }}'
      sequence:
      - action: notify.mobile_app_x_phone
        data:
          message: command_activity
          data:
            intent_action: android.intent.action.SET_ALARM
            intent_extras: android.intent.extra.alarm.HOUR:{{ alarm_plan.data.alarm_2_time.split(':')[0]
              | int }},android.intent.extra.alarm.MINUTES:{{ alarm_plan.data.alarm_2_time.split(':')[1]
              | int }},android.intent.extra.alarm.MESSAGE:{{ ('HA - ' ~ alarm_plan.data.alarm_2_label)
              | urlencode }}:String.urlencoded,android.intent.extra.alarm.SKIP_UI:true
  - delay:
      seconds: 10
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ alarm_plan.data.alarm_3_needed | bool }}'
      sequence:
      - action: notify.mobile_app_x_phone
        data:
          message: command_activity
          data:
            intent_action: android.intent.action.SET_ALARM
            intent_extras: android.intent.extra.alarm.HOUR:{{ alarm_plan.data.alarm_3_time.split(':')[0]
              | int }},android.intent.extra.alarm.MINUTES:{{ alarm_plan.data.alarm_3_time.split(':')[1]
              | int }},android.intent.extra.alarm.MESSAGE:{{ ('HA - ' ~ alarm_plan.data.alarm_3_label)
              | urlencode }}:String.urlencoded,android.intent.extra.alarm.SKIP_UI:true
  - action: notify.mobile_app_x_phone
    data:
      title: "{% if alarm_plan.data.manual_review_needed | bool %}\n  ⚠️ Automatic
        Alarm — please check\n{% elif alarm_plan.data.alarm_1_needed | bool\n    or
        alarm_plan.data.alarm_2_needed | bool\n    or alarm_plan.data.alarm_3_needed
        | bool %}\n  Alarms set\n{% else %}\n  No alarms needed\n{% endif %}"
      message: "{% if alarm_plan.data.alarm_1_needed | bool %}\nAlarm {{ alarm_plan.data.alarm_1_time[:5]
        }} — {{ alarm_plan.data.alarm_1_label }} at {{ alarm_plan.data.alarm_1_event_time
        }}\n{% endif %}\n{% if alarm_plan.data.alarm_2_needed | bool %}\nAlarm {{
        alarm_plan.data.alarm_2_time[:5] }} — {{ alarm_plan.data.alarm_2_label }}
        at {{ alarm_plan.data.alarm_2_event_time }}\n{% endif %}\n{% if alarm_plan.data.alarm_3_needed
        | bool %}\nAlarm {{ alarm_plan.data.alarm_3_time[:5] }} — {{ alarm_plan.data.alarm_3_label
        }} at {{ alarm_plan.data.alarm_3_event_time }}\n{% endif %}\n{% if not (alarm_plan.data.alarm_1_needed
        | bool)\n      and not (alarm_plan.data.alarm_2_needed | bool)\n      and
        not (alarm_plan.data.alarm_3_needed | bool) %}\nNothing in the calendar requires
        a wake-up alarm.\n{% endif %}\n{% if alarm_plan.data.manual_review_needed
        | bool %}\n\nCheck manually: {{ alarm_plan.data.manual_review_reason }}\n{%
        endif %}"
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.automatic_alarm_last_success
    data:
      datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
  mode: single
- id: '1791300241153'
  alias: Automatic alarm planner watchdog
  description: Warns if the nightly alarm planning workflow did not finish successfully.
  triggers:
  - trigger: time
    at: '20:15:00'
  conditions:
  - condition: template
    value_template: "{{ as_timestamp(states('input_datetime.automatic_alarm_last_success'),
      0)\n   < as_timestamp(today_at('19:50')) }}"
  actions:
  - action: notify.mobile_app_x_phone
    data:
      title: ⚠️ Automatic alarm problem
      message: Automatic alarm planning did not complete successfully tonight. Please
        check your calendar and morning alarms manually.
      data:
        ttl: 0
        priority: high
  mode: single
