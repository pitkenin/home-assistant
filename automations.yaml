- id: '1773949419676'
  alias: (OLD) Hallway Light Motion Activation
  description: Controls the lights in the hallway based on a motion sensor.
  triggers:
  - type: occupied
    device_id: 1f77ec67617a8ffa5816cd79982d271e
    entity_id: a555ec3b78937ca03e45669429c79601
    domain: binary_sensor
    trigger: device
  conditions:
  - condition: state
    entity_id: input_select.hallway_lighting_mode
    state:
    - Auto
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_select.time_of_day_mode
        state:
        - Night
      sequence:
      - alias: Turn on the light
        action: light.turn_on
        target:
          entity_id:
          - light.hallway_light_3
        data:
          effect: Night light
    default:
    - alias: Turn on the light
      action: light.turn_on
      target:
        entity_id:
        - light.hallway_light_1
        - light.hallway_light_2
        - light.hallway_light_3
      data: {}
  - wait_for_trigger:
    - trigger: state
      entity_id:
      - binary_sensor.hallway_occupancy
      to:
      - 'off'
      for:
        hours: 0
        minutes: 0
        seconds: 30
    timeout:
      hours: 1
      minutes: 0
      seconds: 0
      milliseconds: 0
  - if:
    - condition: state
      entity_id: input_select.hallway_lighting_mode
      state:
      - Auto
    then:
    - alias: Turn off the light
      action: light.turn_off
      target:
        entity_id:
        - light.hallway_light_1
        - light.hallway_light_2
        - light.hallway_light_3
  mode: restart
  max_exceeded: silent
