          selector:
            text:
        alarm_2_needed:
          description: Whether a second independent wake-up alarm is required.
          required: true
          selector:
            boolean:
        alarm_2_time:
          description: Local alarm time in HH:MM:SS format. Use 00:00:00 if unused.
          required: true
