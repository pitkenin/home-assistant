- id: '1786179502120'
  alias: Maintenance Mode State Transitions
  description: Applies all changes that should happen when Vibe Mode changes to Maintenance.
  triggers:
  - trigger: state
    entity_id:
    - input_select.vibe_mode
    to:
    - Maintenance
    id: Start Maintenance
  - trigger: state
    entity_id:
    - input_select.vibe_mode
    id: Finish Maintenance
    from:
    - Maintenance
  conditions: []
  actions:
  - alias: Start or Finish Maintenance
    choose:
    - conditions:
      - condition: trigger
        id:
        - Start Maintenance
      sequence:
      - action: input_select.select_option
        metadata: {}
        target:
          entity_id:
          - input_select.hallway_lighting_mode
          - input_select.jungle_ceiling_lighting_mode
          - input_select.monkey_lighting_mode
          - input_select.jungle_sink_lighting_mode
          - input_select.toilet_ceiling_lighting_mode
          - input_select.toilet_sink_lighting_mode
        data:
          option: Infinite
      - action: input_boolean.turn_off
        metadata: {}
        target:
          entity_id: input_boolean.jungle_music
        data: {}
    - conditions:
      - condition: trigger
        id:
        - Finish Maintenance
      sequence:
      - action: input_select.select_option
        metadata: {}
        target:
          entity_id:
          - input_select.hallway_lighting_mode
          - input_select.jungle_ceiling_lighting_mode
          - input_select.monkey_lighting_mode
          - input_select.jungle_sink_lighting_mode
          - input_select.toilet_ceiling_lighting_mode
          - input_select.toilet_sink_lighting_mode
        data:
          option: Auto
      - action: input_boolean.turn_on
        metadata: {}
        target:
          entity_id: input_boolean.jungle_music
        data: {}
  mode: single
