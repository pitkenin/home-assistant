  alias: Vibe Mode State Transitions
  description: Applies all changes that should happen when Vibe Mode changes.
  triggers:
  - trigger: state
    entity_id:
    - input_select.vibe_mode
    to:
    - Maintenance
    id: Start Maintenance
  - trigger: state
    entity_id:
    - input_select.vibe_mode
    id: Finish Maintenance
    from:
    - Maintenance
  - trigger: state
    entity_id:
    - input_select.vibe_mode
  conditions: []
  actions:
  - alias: Start or Finish Maintenance
    choose:
    - conditions:
      - condition: trigger
        id:
        - Start Maintenance
      sequence:
      - action: input_boolean.turn_off
        metadata: {}
        target:
          entity_id:
          - input_boolean.jungle_music
          - input_boolean.hallway_lights_auto_mode
          - input_boolean.kitchen_lights_auto_mode
          - input_boolean.monkey_light_auto_mode
          - input_boolean.jungle_ceiling_light_auto_mode
          - input_boolean.jungle_sink_light_auto_mode
          - input_boolean.toilet_ceiling_light_auto_mode
          - input_boolean.toilet_sink_light_auto_mode
        data: {}
      - action: script.set_manual_mode_timer
        metadata: {}
        data:
          mode: Infinite
          force: false
          auto_mode_helper: input_boolean.hallway_lights_auto_mode
          timer_active_helper: input_boolean.hallway_lights_timer_active
          expiration_helper: input_datetime.hallway_lights_manual_expiration
      - action: script.set_manual_mode_timer
        metadata: {}
        data:
          mode: Infinite
          force: false
          auto_mode_helper: input_boolean.jungle_ceiling_light_auto_mode
          timer_active_helper: input_boolean.jungle_ceiling_light_timer_active
          expiration_helper: input_datetime.jungle_ceiling_light_manual_expiration
      - action: script.set_manual_mode_timer
        metadata: {}
        data:
          mode: Infinite
          force: false
          auto_mode_helper: input_boolean.jungle_sink_light_auto_mode
          timer_active_helper: input_boolean.jungle_sink_light_timer_active
          expiration_helper: input_datetime.jungle_sink_light_manual_expiration
      - action: script.set_manual_mode_timer
        metadata: {}
        data:
          mode: Infinite
          force: false
          auto_mode_helper: input_boolean.kitchen_lights_auto_mode
          timer_active_helper: input_boolean.kitchen_lights_timer_active
          expiration_helper: input_datetime.kitchen_lights_manual_expiration
      - action: script.set_manual_mode_timer
        metadata: {}
        data:
          mode: Infinite
          force: false
          auto_mode_helper: input_boolean.monkey_light_auto_mode
          timer_active_helper: input_boolean.monkey_light_timer_active
          expiration_helper: input_datetime.monkey_light_manual_expiration
      - action: script.set_manual_mode_timer
        metadata: {}
        data:
          mode: Infinite
          force: false
          auto_mode_helper: input_boolean.toilet_ceiling_light_auto_mode
          timer_active_helper: input_boolean.toilet_ceiling_light_timer_active
          expiration_helper: input_datetime.toilet_ceiling_light_manual_expiration
      - action: script.set_manual_mode_timer
        metadata: {}
        data:
          mode: Infinite
          force: false
          auto_mode_helper: input_boolean.toilet_sink_light_auto_mode
          timer_active_helper: input_boolean.toilet_sink_light_timer_active
          expiration_helper: input_datetime.toilet_sink_light_manual_expiration
    - conditions:
      - condition: trigger
        id:
        - Finish Maintenance
      sequence:
      - action: input_boolean.turn_on
        metadata: {}
        target:
          entity_id:
          - input_boolean.jungle_music
          - input_boolean.hallway_lights_auto_mode
          - input_boolean.kitchen_lights_auto_mode
          - input_boolean.monkey_light_auto_mode
          - input_boolean.jungle_ceiling_light_auto_mode
          - input_boolean.jungle_sink_light_auto_mode
          - input_boolean.toilet_ceiling_light_auto_mode
          - input_boolean.toilet_sink_light_auto_mode
        data: {}
      - action: input_boolean.turn_off
        metadata: {}
        data: {}
        target:
          entity_id:
          - input_boolean.hallway_lights_timer_active
          - input_boolean.monkey_light_timer_active
          - input_boolean.jungle_ceiling_light_timer_active
          - input_boolean.jungle_sink_light_timer_active
          - input_boolean.toilet_ceiling_light_timer_active
          - input_boolean.toilet_sink_light_timer_active
          - input_boolean.kitchen_lights_timer_active
    - conditions:
      - condition: state
        entity_id: input_select.vibe_mode
        state:
        - Board Games
      sequence:
        action: script.turn_on
        target:
          entity_id: script.cycle_light_brightness
        data:
          variables:
            target_light: light.table_light
            target_brightness: Bright
    - conditions:
      - condition: state
        entity_id: input_select.vibe_mode
        state:
        - Sauna
        - Cozy Nook
      sequence:
      - if:
        - condition: light.is_on
          target:
            entity_id: light.table_light
          options:
            behavior: any
            for: 00:00:00
        then:
        - action: script.turn_on
          target:
            entity_id: script.cycle_light_brightness
          data:
            variables:
              target_light: light.table_light
              target_brightness: Dim
      - if:
        - condition: light.is_on
          target:
            entity_id: light.couch_light
          options:
            behavior: any
            for: 00:00:00
        then:
        - action: script.turn_on
          target:
            entity_id: script.cycle_light_brightness
          data:
            variables:
              target_light: light.couch_light
              target_brightness: Dim
    - conditions:
      - condition: state
        entity_id: input_select.vibe_mode
        state:
        - Movie
      sequence:
      - action: light.turn_off
        metadata: {}
        target:
          entity_id: light.couch_light
        data: {}
      - action: light.turn_off
        metadata: {}
        target:
          entity_id: light.table_light
        data: {}
  mode: single
