  triggers:
  - trigger: state
    entity_id:
    - input_boolean.jungle_toilet_occupancy
    id: toilet
    to:
    - 'on'
  - trigger: state
    entity_id:
    - input_boolean.jungle_shower_occupancy
    for:
      hours: 0
      minutes: 0
      seconds: 0
    id: shower
    to:
    - 'on'
  - trigger: state
    entity_id:
    - input_boolean.shower_on
    for:
      hours: 0
      minutes: 0
      seconds: 20
    id: shower long
    to:
    - 'on'
  - trigger: state
    entity_id:
    - input_boolean.shower_on
    id: shower cleared
    to:
    - 'off'
  - trigger: state
    entity_id:
    - input_boolean.jungle_sink_occupancy
    for:
      hours: 0
      minutes: 0
      seconds: 0
    id: sink
    to:
    - 'on'
