  mode: queued
  max: 10
- id: '1786518946352'
  alias: Adjust Jungle Target Volume
  description: Adjusts Jungle Target Volume Based on current Vibe Mode and other helpers.
    Can be triggered manually to restore the correct target volume.
  triggers:
  - trigger: state
    entity_id: input_select.vibe_mode
  - trigger: state
    entity_id:
    - input_boolean.shower_on
    to:
    - 'on'
    - 'off'
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.shower_on
        state:
        - 'on'
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.jungle_target_volume
        data:
          value: 0.95
    - conditions:
      - condition: state
        entity_id: input_boolean.shower_on
        state:
        - 'off'
      sequence:
      - variables:
          vibe_targets:
            Normal: 0.7
            Movie: 0.5
            Cozy Nook: 0.5
            Sauna: 0.65
            Party: 0.7
            Maintenance: 0
            Board Games: 0.7
      - action: input_number.set_value
        target:
          entity_id: input_number.jungle_target_volume
        data:
          value: '{{ vibe_targets.get(states(''input_select.vibe_mode''), 0.5) | float
            }}'
  mode: single
- id: '1786607665342'
  alias: Reset Vibe Mode in the Morning
  description: Resets vibe mode back to Normal in the morning if it is not Maintenance
    and has been off Normal for at least 2 hours.
  triggers:
  - trigger: time
    at: 07:00:00
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
    - sat
    - sun
  conditions:
  - condition: state
    entity_id: input_select.vibe_mode
    state:
    - Board Games
    - Cozy Nook
    - Movie
    - Party
    - Sauna
    for:
      hours: 2
      minutes: 0
      seconds: 0
  actions:
  - action: input_select.select_option
    metadata: {}
    target:
      entity_id: input_select.vibe_mode
    data:
      option: Normal
  mode: single
- id: '1786652576775'
  alias: X Light Scroll Button
  description: Controls X Light when using the ikea BILRESA scrollbutton
  use_blueprint:
    path: custom/ikea-bilresa-scroll-wheel-kelvin-v2.yaml
    input:
      controller_device: 8acd1351864ee2c2bdeb153046c1315e
      scroll_target: light.x_light
      warmth_min_kelvin: 2200
      hue_select_helper: input_boolean.x_light_hue_select
- id: '1786956286788'
  alias: Update Brightness Helper on Toggle
  description: Keeps track of the light state machines with manual 3-step on/off toggle
    dimmers
  triggers:
  - entity_id:
    - light.couch_light
    - light.table_light
    from: 'off'
    to: 'on'
    trigger: state
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ 196 <= time_off_ms <= 1753 }}'
      sequence:
      - action: input_select.select_option
        target:
          entity_id: '{{ brightness_select }}'
        data:
          option: '{% if current_state == ''Bright'' %} Normal {% elif current_state
            == ''Normal'' %} Dim {% else %} Bright {% endif %}

            '
    - conditions:
      - condition: template
        value_template: '{{ 1754 <= time_off_ms <= 2130 }}'
      sequence:
      - action: input_select.select_option
        target:
          entity_id: '{{ brightness_select }}'
        data:
          option: '{% if current_state == ''Bright'' %} Normal {% else %} Bright {%
            endif %}

            '
    - conditions:
      - condition: template
        value_template: '{{ time_off_ms > 2130 }}'
      sequence:
      - action: input_select.select_option
        target:
          entity_id: '{{ brightness_select }}'
        data:
          option: Bright
  - if:
    - condition: template
      value_template: '{{ 2000 <= time_off_ms <= 2500 }}'
    then:
    - action: ticker.notify
      metadata: {}
      data:
        category: X Notifications
        message: 'Check brightness helper sync of living room lights '
        title: ' '
  mode: parallel
  variables:
    light_id: '{{ trigger.entity_id.split(''.'')[1] }}'
    brightness_select: input_select.{{ light_id }}_brightness
    current_state: '{{ states(brightness_select) }}'
    time_off_ms: '{{ ((as_timestamp(trigger.to_state.last_changed, 0) - as_timestamp(trigger.from_state.last_changed,
      0)) * 1000) | int(0) }}

      '
