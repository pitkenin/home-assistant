- id: '1782341081247'
  alias: Jungle Sound
  description: Controls primary and secondary audiostream based on bathroom presence
    and time of day. Creates a jungle-themed ambience in the bathroom with a few eastereggs.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.jungle_presence
    to:
    - 'on'
    id: room_entered
  - trigger: state
    entity_id:
    - binary_sensor.jungle_presence
    to:
    - 'off'
    id: room_left
    for:
      hours: 0
      minutes: 0
      seconds: 2
  - trigger: state
    entity_id:
    - binary_sensor.jungle_toilet_presence
    to:
    - 'on'
    id: toilet_occupied
  - trigger: state
    entity_id:
    - binary_sensor.jungle_toilet_presence
    to:
    - 'off'
    id: toilet_vacant
  - trigger: state
    entity_id: input_select.time_of_day_mode
    id: time_changed
  conditions:
  - condition: state
    entity_id: input_boolean.jungle_music
    state:
    - 'on'
  actions:
  - variables:
      vibe_mode: '{{ states(''input_select.vibe_mode'') }}'
      ambient_id: '{% set mode = states(''input_select.time_of_day_mode'') %} {% if
        mode == ''Morning'' %} Jungle Morning {% elif mode == ''Day'' %} Jungle Day
        {% else %} Jungle Night {% endif %}

        '
      vibe_settings:
        Normal:
          target: 0.45
          track_2: 0.4
        Movie:
          target: 0.35
          track_2: 0.3
        Cozy Nook:
          target: 0.35
          track_2: 0.3
        Sauna:
          target: 0.45
          track_2: 0.4
        Party:
          target: 0.5
          track_2: 0.45
        Maintenance:
          target: 0
          track_2: 0
        Board Games:
          target: 0.45
          track_2: 0.4
      settings: '{{ vibe_settings.get(vibe_mode, {''target'': 0.5, ''track_2'': 0.4})
        }}'
      target_vol: '{{ settings.target | float }}'
      track_2_vol: '{{ settings.track_2 | float }}'
      track_1_vol: "{% if track_2_vol >= target_vol %}\n  0.0\n{% else %}\n  {{ ((target_vol
        ** 2 - track_2_vol ** 2) ** 0.5) | round(2) }}\n{% endif %}\n"
  - choose:
    - conditions:
      - condition: trigger
        id:
        - room_entered
        - time_changed
      sequence:
      - action: script.jungle_audio_request
        metadata: {}
        data:
          forceplay: true
          category: ambient
          sound_id: '{{ ambient_id }}'
          volume: '{{ target_vol }}'
    - conditions:
      - condition: trigger
        id: toilet_occupied
      - condition: state
        entity_id: input_boolean.jungle_easter_egg_played
        state: 'off'
      sequence:
      - parallel:
        - action: script.jungle_audio_request
          metadata: {}
          data:
            category: easter_egg
            sound_id: Terraria Jungle
            volume: '{{ track_2_vol }}'
        - action: script.universal_volume_fade
          metadata: {}
          data:
            duration_seconds: 5
            steps: 50
            target_player: media_player.janitor_primary
            target_volume: '{{ track_1_vol }}'
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.jungle_easter_egg_played
    - conditions:
      - condition: trigger
        id: toilet_vacant
      sequence:
      - parallel:
        - action: script.jungle_audio_pause
          metadata: {}
          data:
            category: easter_egg
        - if:
          - condition: state
            entity_id: binary_sensor.jungle_presence
            state:
            - 'on'
          then:
          - action: script.universal_volume_fade
            metadata: {}
            data:
              duration_seconds: 5
              steps: 50
              target_player: media_player.janitor_primary
              target_volume: '{{ target_vol }}'
          - action: script.jungle_audio_request
            metadata: {}
            data:
              category: ambient
              volume: '{{ target_vol }}'
              sound_id: '"{{ ambient_id }}"'
          else:
          - action: script.jungle_audio_pause
            metadata: {}
            data:
              category: ambient
    - conditions:
      - condition: trigger
        id: room_left
      sequence:
      - action: script.jungle_audio_pause
        metadata: {}
        data:
          category: ambient
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.jungle_easter_egg_played
        data: {}
  mode: queued
  max: 5
- id: '1784909281271'
  alias: Janitor Speakers Self-Heal (SSH Restart + MA Reload)
  description: ' If speakers malfunction, tries to restore bathroom speaker system
    following a malfunction and sends a notification.'
  triggers:
  - trigger: state
    entity_id:
    - media_player.janitor_primary
    - media_player.janitor_secondary
    to: unavailable
    for: 00:03:00
    id: went_unavailable
  - trigger: time_pattern
    minutes: /5
    id: periodic
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: media_player.janitor_primary
      state: unavailable
      for: 00:03:00
    - condition: state
      entity_id: media_player.janitor_secondary
      state: unavailable
      for: 00:03:00
  actions:
  - action: ticker.notify
    data:
      actions: category_default
      category: X Notifications
      title: PROBLEM
      message: Janitor speakers are malfunctioning.
  - if:
    - condition: state
      entity_id: media_player.janitor_primary
      state: unavailable
    then:
    - action: shell_command.reboot_janitor_speaker
  - if:
    - condition: state
      entity_id: media_player.janitor_secondary
      state: unavailable
    then:
    - action: shell_command.reboot_janitor_speaker_secondary
  - action: homeassistant.reload_config_entry
    target:
      entity_id: media_player.janitor_primary
  mode: queued
  max: 5
