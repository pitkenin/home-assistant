- id: '1775415056062'
  alias: Printer Ink Alert System
  description: Sends a persistent phone notification when the printer's ink level
    gets low.
  triggers:
  - entity_id:
    - sensor.epson_et_8550_series_c
    - sensor.epson_et_8550_series_gy
    - sensor.epson_et_8550_series_m
    - sensor.epson_et_8550_series_mb
    - sensor.epson_et_8550_series_pb
    - sensor.epson_et_8550_series_y
    below: 25
    id: send_alert
    trigger: numeric_state
  - entity_id:
    - sensor.epson_et_8550_series_c
    - sensor.epson_et_8550_series_gy
    - sensor.epson_et_8550_series_m
    - sensor.epson_et_8550_series_mb
    - sensor.epson_et_8550_series_pb
    - sensor.epson_et_8550_series_y
    above: 25
    id: clear_alert
    trigger: numeric_state
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: send_alert
      sequence:
      - action: input_boolean.turn_on
        metadata: {}
        target:
          entity_id: input_boolean.printer_ink_level_low
        data: {}
      - action: script.create_persistent_notification
        metadata: {}
        data:
          topic: X Notifications
          task_helper: input_boolean.printer_ink_level_low
          message: Ink level low. Please refill.
          title: Alert
    - conditions:
      - condition: trigger
        id: clear_alert
      sequence:
      - action: input_boolean.turn_off
        metadata: {}
        target:
          entity_id: input_boolean.printer_ink_level_low
        data: {}
  mode: single
- id: '1775427245179'
  alias: Persistent Notification Manager
  description: Resends notifications if swiped while task is incomplete
  triggers:
  - trigger: event
    event_type: mobile_app_notification_cleared
  conditions:
  - condition: template
    value_template: "{% set tag = trigger.event.data.tag %}\n{% if tag and ':' in
      tag %}\n  {% set helper = tag.split(':')[1] %}\n  {# Nag if: it's a 'Task' and
      is OFF, OR it's an 'Alert/Low' and is ON #}\n  {{ is_state(helper, 'on') }}\n{%
      else %}\n  false\n{% endif %}\n"
  actions:
  - action: ticker.notify
    data:
      category: '{{ trigger.event.data.tag.split('':'')[0] }}'
      title: '{{ trigger.event.data.title }}'
      message: '{{ trigger.event.data.message }}'
      data:
        tag: '{{ trigger.event.data.tag }}'
