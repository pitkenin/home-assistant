- id: '1782341081247'
  alias: Jungle Ambient Handler
  description: Controls ambient soundtrack based on bathroom occupancy and time of
    day.
  triggers:
  - trigger: state
    entity_id:
    - input_boolean.jungle_occupancy
    id: room_entered
    to:
    - 'on'
  - trigger: state
    entity_id:
    - input_boolean.jungle_occupancy
    to:
    - 'off'
    id: room_left
  - trigger: state
    entity_id: input_select.time_of_day_mode
    id: time_changed
  - trigger: state
    entity_id:
    - input_boolean.thunderstorm_playing
    to:
    - 'on'
    id: start thunderstorm
  - trigger: state
    entity_id:
    - input_boolean.thunderstorm_playing
    to:
    - 'off'
    id: end thunderstorm
  conditions:
  - condition: or
    conditions:
    - condition: and
      conditions:
      - condition: state
        entity_id: input_boolean.jungle_music
        state: 'on'
      - condition: trigger
        id:
        - room_entered
        - time_changed
        - start thunderstorm
    - condition: trigger
      id:
      - room_left
      - end thunderstorm
  actions:
  - variables:
      ambient_id: '{% set mode = states(''input_select.time_of_day_mode'') %} {% if
        mode == ''Morning'' %} Jungle Morning {% elif mode == ''Day'' %} Jungle Day
        {% else %} Jungle Night {% endif %}

        '
  - choose:
    - conditions:
      - condition: trigger
        id:
        - room_entered
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.jungle_audio_controller
        data:
          variables:
            action: play
            category: ambient
            sound_id: '{{ ambient_id }}'
            volume_ratio: 1
    - conditions:
      - condition: trigger
        id:
        - time_changed
      - condition: state
        entity_id: input_boolean.thunderstorm_playing
        state:
        - 'off'
      sequence:
      - if:
        - condition: state
          entity_id: binary_sensor.jungle_presence
          state: 'on'
        then:
        - action: script.turn_on
          target:
            entity_id: script.jungle_audio_controller
          data:
            variables:
              action: play
              category: ambient
              sound_id: '{{ ambient_id }}'
              volume_ratio: 1
        else:
        - action: script.turn_on
          target:
            entity_id: script.jungle_audio_controller
          data:
            variables:
              action: play
              category: ambient
              sound_id: '{{ ambient_id }}'
              volume_ratio: 0
    - conditions:
      - condition: trigger
        id:
        - start thunderstorm
      sequence:
      - action: automation.trigger
        metadata: {}
        target:
          entity_id: automation.adjust_jungle_target_volume
        data:
          skip_condition: true
      - action: script.turn_on
        target:
          entity_id: script.jungle_audio_controller
        data:
          variables:
            volume_ratio: 1
            forceplay: true
            action: play
            category: ambient
            sound_id: '{{ states(''input_text.jungle_ambient_sound'') | replace(''
              Rain'', '''') ~ '' Rain'' }}'
      - action: script.turn_on
        target:
          entity_id: script.play_thunderstorm
        data: {}
    - conditions:
      - condition: trigger
        id:
        - end thunderstorm
      sequence:
      - action: automation.trigger
        metadata: {}
        target:
          entity_id: automation.adjust_jungle_target_volume
        data:
          skip_condition: true
      - action: script.turn_on
        target:
          entity_id: script.jungle_audio_controller
        metadata: {}
        data:
          variables:
            volume_ratio: 1
            forceplay: true
            action: play
            category: ambient
            sound_id: '{{ states(''input_text.jungle_ambient_sound'') | replace(''
              Rain'', '''') }}'
    - conditions:
      - condition: trigger
        id: room_left
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.jungle_easter_egg_played
      - action: script.turn_on
        target:
          entity_id: script.jungle_audio_controller
        data:
          variables:
            action: stop
            category: ambient
      - action: script.turn_on
        target:
          entity_id: script.jungle_audio_controller
        data:
          variables:
            action: play
            category: ambient
            sound_id: '{{ ambient_id }}'
            volume_ratio: 0
            skip_fade_in: true
  mode: queued
  max: 10
- id: '1784909281271'
  alias: Janitor Speakers Self-Heal (SSH Restart + MA Reload)
  description: ' If speakers malfunction, tries to restore bathroom speaker system
    following a malfunction and sends a notification.'
  triggers:
  - trigger: state
    entity_id:
    - media_player.janitor_primary
    - media_player.janitor_secondary
    to:
    - unavailable
    for:
      hours: 0
      minutes: 0
      seconds: 30
    id: went_unavailable
  - trigger: time_pattern
    minutes: /5
    id: periodic
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: media_player.janitor_primary
      state:
      - unavailable
    - condition: state
      entity_id: media_player.janitor_secondary
      state:
      - unavailable
  actions:
  - if:
    - condition: trigger
      id: just_recovered
    then:
    - action: homeassistant.reload_config_entry
      target:
        entity_id: media_player.janitor_primary
    else:
    - action: ticker.notify
      data:
        actions: category_default
        category: X Notifications
        title: PROBLEM
        message: Janitor speakers are malfunctioning.
    - if:
      - condition: state
        entity_id: media_player.janitor_primary
        state: unavailable
      then:
      - action: shell_command.reboot_janitor_speaker
    - if:
      - condition: state
        entity_id: media_player.janitor_secondary
        state: unavailable
      then:
      - action: shell_command.reboot_janitor_speaker_secondary
    - action: homeassistant.reload_config_entry
      target:
        entity_id: media_player.janitor_primary
  mode: queued
  max: 5
