- id: '1790629809163'
  alias: Janitor Speakers Self-Heal
  description: Repairs a player that has remained unavailable or unknown for two minutes.
    Successful recovery is logged silently; sends a phone alert only when a player
    is still unavailable after the repair attempt. A ten-minute cooldown limits repeated
    repair attempts.
  triggers:
  - trigger: state
    entity_id:
    - media_player.janitor_primary
    - media_player.janitor_secondary
    to: unavailable
    for: 00:02:00
    id: unavailable
  - trigger: state
    entity_id:
    - media_player.janitor_primary
    - media_player.janitor_secondary
    to: unknown
    for: 00:02:00
    id: unknown
  - trigger: time_pattern
    minutes: /5
    id: periodic
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: media_player.janitor_primary
      state: unavailable
      for: 00:02:00
    - condition: state
      entity_id: media_player.janitor_primary
      state: unknown
      for: 00:02:00
    - condition: state
      entity_id: media_player.janitor_secondary
      state: unavailable
      for: 00:02:00
    - condition: state
      entity_id: media_player.janitor_secondary
      state: unknown
      for: 00:02:00
  actions:
  - variables:
      initial_primary: '{{ states(''media_player.janitor_primary'') }}'
      initial_secondary: '{{ states(''media_player.janitor_secondary'') }}'
      affected_players: "{% set ns = namespace(players=[]) %} {% for player in ['media_player.janitor_primary',\n
        \                 'media_player.janitor_secondary'] %}\n  {% set entity =
        states[player] %}\n  {% if entity is not none\n        and entity.state in
        ['unavailable', 'unknown']\n        and (as_timestamp(now()) - as_timestamp(entity.last_changed))
        >= 120 %}\n    {% set ns.players = ns.players + [player] %}\n  {% endif %}\n{%
        endfor %} {{ ns.players }}"
      primary_restart:
        returncode: -999
      secondary_restart:
        returncode: -999
  - condition: template
    value_template: '{{ affected_players | count > 0 }}'
  - action: system_log.write
    continue_on_error: true
    data:
      level: warning
      logger: janitor.self_heal
      message: Starting availability repair. Primary={{ initial_primary }}, secondary={{
        initial_secondary }}. Affected={{ affected_players }}.
  - action: homeassistant.reload_config_entry
    continue_on_error: true
    target:
      entity_id: media_player.janitor_primary
  - delay: 00:00:45
  - if:
    - condition: template
      value_template: "{{ 'media_player.janitor_primary' in affected_players\n   and
        states('media_player.janitor_primary') in ['unavailable', 'unknown'] }}"
    then:
    - action: shell_command.reboot_janitor_speaker
      continue_on_error: true
      response_variable: primary_restart
  - if:
    - condition: template
      value_template: "{{ 'media_player.janitor_secondary' in affected_players\n   and
        states('media_player.janitor_secondary') in ['unavailable', 'unknown'] }}"
    then:
    - action: shell_command.reboot_janitor_speaker_secondary
      continue_on_error: true
      response_variable: secondary_restart
  - delay: 00:01:00
  - variables:
      final_primary: '{{ states(''media_player.janitor_primary'') }}'
      final_secondary: '{{ states(''media_player.janitor_secondary'') }}'
      primary_code: '{{ (primary_restart | default({})).get(''returncode'', -999)
        }}'
      secondary_code: '{{ (secondary_restart | default({})).get(''returncode'', -999)
        }}'
  - action: system_log.write
    continue_on_error: true
    data:
      level: warning
      logger: janitor.self_heal
      message: 'Availability repair result. Primary={{ final_primary }}, secondary={{
        final_secondary }}. SSH return codes: primary={{ primary_code }}, secondary={{
        secondary_code }}. -999 means skipped or no response; 0 means command succeeded,
        not proof of audible playback. Inspect the trace for action errors.'
  - if:
    - condition: template
      value_template: '{{ final_primary in [''unavailable'', ''unknown''] or final_secondary
        in [''unavailable'', ''unknown''] }}'
    then:
    - action: ticker.notify
      continue_on_error: true
      data:
        actions: category_default
        category: X Notifications
        title: Janitor speakers need attention
        message: Automatic repair did not restore availability. Primary={{ final_primary
          }}, secondary={{ final_secondary }}. Check Pi power/Wi-Fi and Music Assistant.
          Details are in the self-heal trace.
  - delay: 00:10:00
  mode: single
  max_exceeded: silent
  trace:
    stored_traces: 10
